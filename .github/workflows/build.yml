name: Build Minecraft targets
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        minecraft: ['1.16.5', '1.20.1', '1.21.4', '1.21.8', '1.21.11', '26.1', '26.2', '26.3']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: bash gradlew -Pmc=${{ matrix.minecraft }} build
      - uses: actions/upload-artifact@v4
        with:
          name: ZakoHeads-mc${{ matrix.minecraft }}
          path: versions/${{ matrix.minecraft }}/build/libs/*.jar
          if-no-files-found: error
