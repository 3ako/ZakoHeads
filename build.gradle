plugins { id 'base' }
tasks.register('buildAll') {
    group = 'build'
    description = 'Build all selected Minecraft targets.'
    dependsOn subprojects.collect { "${it.path}:build" }
}
tasks.named('build') { dependsOn 'buildAll' }
tasks.named('clean') { dependsOn subprojects.collect { "${it.path}:clean" } }
