version = "${rootProject.mod_version}+mc${project.minecraft_version}"
group = rootProject.maven_group
base { archivesName = rootProject.archives_base_name }
repositories {
    maven { url = 'https://maven.terraformersmc.com/releases/' }
    maven { url = 'https://maven.shedaniel.me/' }
    mavenCentral()
}
def modern = project.minecraft_version.startsWith('26.')
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    if (!modern) mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    add(modern ? 'implementation' : 'modImplementation', "net.fabricmc:fabric-loader:0.20.1")
    add(modern ? 'implementation' : 'modImplementation', "com.terraformersmc:modmenu:${project.modmenu}")
    add(modern ? 'implementation' : 'modImplementation', "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}")
    add(modern ? 'api' : 'modApi', include("me.shedaniel.cloth:cloth-config-fabric:${project.cloth}")) {
        exclude group: 'net.fabricmc.fabric-api'
    }
}
def targetJava = project.java_version.toInteger()
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = targetJava
}
java { withSourcesJar() }
processResources {
    def props = [version: project.version, minecraft_version: project.minecraft_version,
                 loader_version: '0.20.1', java_version: targetJava]
    inputs.properties props
    filteringCharset = 'UTF-8'
    filesMatching('fabric.mod.json') { expand props }
}
jar {
    from(rootProject.file('LICENSE.txt')) { rename { "LICENSE_ZakoHeads.txt" } }
}
